version: '3.8'
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: jabon_api
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://api:3000
    container_name: jabon_web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
